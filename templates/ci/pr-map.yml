name: pr-map

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# One run per pull request at a time, so a second run edits the first run's comment;
# a newer run cancels one that is still pending (C48).
concurrency:
  group: pr-map-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-map:
    name: pr-map
    runs-on: ubuntu-24.04
    # Every step after checkout continues on error (C47): the map is a reading aid, never a failed check.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        continue-on-error: true
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version: "22"
      - name: Install Python packages
        continue-on-error: true
        run: python -m pip install -r .groundwork/bin/pr_map/requirements.txt
      - name: Install Node packages
        continue-on-error: true
        run: npm ci --prefix .groundwork/bin/pr_map
      - name: Map the pull request
        continue-on-error: true
        run: python .groundwork/bin/pr_map/pr_map.py --base "origin/${{ github.base_ref }}" --out "${{ runner.temp }}/pr-map" --post
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: pr-map
          path: |
            ${{ runner.temp }}/pr-map/pr-map.md
            ${{ runner.temp }}/pr-map/pr-map.json
